name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# No AWS access keys anywhere: id-token lets the job exchange a GitHub OIDC
# token for temporary credentials on the deploy role.
permissions:
  contents: read
  id-token: write

# A newer push supersedes an in-flight deploy rather than racing it.
concurrency:
  group: deploy-site
  cancel-in-progress: true

env:
  AWS_REGION: eu-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test contact handler
        run: npm test

      - name: Build site
        env:
          CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}
        run: npm run build:site

      - name: Fail if the endpoint was not baked in
        run: |
          if grep -q '__CONTACT_ENDPOINT__' dist/js/main.js; then
            echo "::error::CONTACT_ENDPOINT variable is not set in this repository."
            echo "Set it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Fingerprinted filenames are not used, so caching is split by path:
      # assets get a long TTL, HTML must always revalidate.
      - name: Upload immutable assets
        run: |
          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET }}/" \
            --delete \
            --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload HTML
        run: |
          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET }}/" \
            --exclude "*" --include "*.html" \
            --cache-control "public,max-age=0,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $ID created"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$ID"

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- Bucket: \`${{ secrets.S3_BUCKET }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
